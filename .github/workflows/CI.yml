name: CI

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Lint and format check - runs early on PRs to catch issues fast
  lint:
    runs-on: ubuntu-22.04
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Lint (Python + Rust)
        run: uv run task lint:all

  # Unit tests - runs on PRs, main branch pushes, and tag pushes with Python version matrix
  test:
    runs-on: ubuntu-22.04
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')))
    # PYO3_USE_ABI3_FORWARD_COMPATIBILITY allows transitive dependencies (like rpds-py)
    # that use older PyO3 versions to build from source on Python 3.14+
    env:
      PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - uses: astral-sh/setup-uv@v7
      - name: Cache Rust build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-v2-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            rust-v2-${{ runner.os }}-py${{ matrix.python-version }}-
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Build and test
        run: |
          uv run task dev
          uv run task test:unit

  # Downstream compatibility: pyvespa's unit suite against the wheel built from
  # this commit. pyvespa is the main consumer of httpr and consumed lazy
  # generators after `close()` for a year without anyone noticing, until 0.7.0
  # made close() real. Runs on PRs, main branch, and tag pushes.
  downstream-pyvespa:
    runs-on: ubuntu-22.04
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')))
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Cache Rust build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-v2-${{ runner.os }}-downstream-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            rust-v2-${{ runner.os }}-downstream-
      - name: Build wheel
        run: uv run --with maturin maturin build --release --out dist
      - name: Check out pyvespa master
        uses: actions/checkout@v5
        with:
          repository: vespa-engine/pyvespa
          ref: master
          path: pyvespa
      - name: Install pyvespa, then swap in this wheel
        # pyvespa pins httpr>=0.4.0 and the local wheel is 0.0.0.dev0, so it
        # cannot be part of the resolve; install it afterwards with --no-deps.
        run: |
          uv venv .venv-pyvespa
          uv pip install --python .venv-pyvespa/bin/python "./pyvespa[unittest]"
          uv pip install --python .venv-pyvespa/bin/python --no-deps --reinstall dist/httpr-*.whl
          .venv-pyvespa/bin/python -c "import importlib.metadata as m; v = m.version('httpr'); assert v.startswith('0.0.0'), v; print('httpr', v)"
      - name: pyvespa unit tests
        # The venv's bin goes first on PATH: the deployment tests create a
        # throwaway Vespa Cloud cert/key pair with the `vespa` CLI (from the
        # `vespacli` package in pyvespa's unittest extra) and skip it otherwise.
        working-directory: pyvespa
        run: |
          export PATH="$GITHUB_WORKSPACE/.venv-pyvespa/bin:$PATH"
          python -m pytest tests/unit -q -p no:cacheprovider

  # E2E tests with httpbun Docker container - runs on PRs, main branch, and tag pushes
  e2e:
    runs-on: ubuntu-22.04
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')))
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Cache Rust build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-v2-${{ runner.os }}-py3.12-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            rust-v2-${{ runner.os }}-py3.12-
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Build Rust extension
        run: uv run task dev
      - name: Add hosts entry
        run: echo '127.0.0.1 httpbun.local' | sudo tee -a /etc/hosts
      - name: Generate SSL certificates
        run: uv run task certs
      - name: Start httpbun container
        run: |
          docker run \
            --name httpbun \
            --detach \
            --publish 443:443 \
            --volume ${{ github.workspace }}/.certs:/certs:ro \
            --env HTTPBUN_TLS_CERT=/certs/server.pem \
            --env HTTPBUN_TLS_KEY=/certs/server.key \
            --pull always \
            sharat87/httpbun
          
          # Wait for container to be ready
          echo "Waiting for httpbun to start..."
          sleep 2
          for i in $(seq 1 10); do
            if curl -sf --cacert .certs/ca.pem https://httpbun.local/get > /dev/null 2>&1; then
              echo "httpbun is ready!"
              break
            fi
            sleep 1
          done
      - name: Run e2e tests
        run: uv run task test:e2e
      - name: Show httpbun logs
        if: always()
        run: docker logs httpbun || true
      - name: Stop httpbun container
        if: always()
        run: docker rm -f httpbun || true

  # Docs build test - runs on PRs to catch broken docs early
  docs:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Build docs
        run: |
          uv sync --extra docs
          uv run mkdocs build --strict

  # Build jobs - run only on tags or manual dispatch
  linux:
    runs-on: ${{ matrix.platform.runner }}
    needs: [test, e2e]
    if: ${{ always() && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && (needs.test.result == 'success' || needs.test.result == 'skipped') && (needs.e2e.result == 'success' || needs.e2e.result == 'skipped') }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64
          - runner: ubuntu-22.04
            target: x86
          - runner: ubuntu-24.04-arm
            target: aarch64
          - runner: ubuntu-22.04
            target: armv7
          # - runner: ubuntu-22.04
          #   target: s390x
          # - runner: ubuntu-22.04
          #   target: ppc64le
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Set version
        uses: ./.github/actions/set-version
        with:
          run-number: ${{ github.run_number }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          sccache: true
          manylinux: auto
      - name: Build free-threaded wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist -i python3.14t
          sccache: true
          manylinux: auto
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: dist
      - name: pytest
        if: ${{ matrix.platform.target == 'x86_64' || matrix.platform.target == 'aarch64' }}
        shell: bash
        env:
          RUSTC_WRAPPER: ""
        run: |
          set -e
          uv sync --extra dev --find-links dist --reinstall
          uv run pytest
      # Skip pytest on armv7 - QEMU emulation is 20x+ slower than native.
      # Tests already run on x86_64 and aarch64 which provides sufficient coverage.

  musllinux:
    runs-on: ${{ matrix.platform.runner }}
    needs: [test, e2e]
    if: ${{ always() && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && (needs.test.result == 'success' || needs.test.result == 'skipped') && (needs.e2e.result == 'success' || needs.e2e.result == 'skipped') }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64
          - runner: ubuntu-22.04
            target: x86
          - runner: ubuntu-24.04-arm
            target: aarch64
          # - runner: ubuntu-22.04
          #   target: armv7
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Set version
        uses: ./.github/actions/set-version
        with:
          run-number: ${{ github.run_number }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: musllinux_1_2
      - name: Build free-threaded wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist -i python3.14t
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: musllinux_1_2
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-musllinux-${{ matrix.platform.target }}
          path: dist
      - name: pytest
        if: ${{ matrix.platform.target == 'x86_64' || matrix.platform.target == 'aarch64' }}
        uses: addnab/docker-run-action@v3
        with:
          image: alpine:latest
          options: -v ${{ github.workspace }}:/io -w /io
          run: |
            set -e
            apk add python3 python3-dev build-base libffi-dev curl
            curl -LsSf https://astral.sh/uv/install.sh | sh
            export PATH="$HOME/.local/bin:$PATH"
            uv sync --extra dev --find-links dist --reinstall
            uv run pytest

  windows:
    runs-on: ${{ matrix.platform.runner }}
    needs: [test, e2e]
    if: ${{ always() && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && (needs.test.result == 'success' || needs.test.result == 'skipped') && (needs.e2e.result == 'success' || needs.e2e.result == 'skipped') }}
    strategy:
      matrix:
        platform:
          - runner: windows-latest
            target: x64
          - runner: windows-latest
            target: x86
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: ${{ matrix.platform.target }}
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Set version
        uses: ./.github/actions/set-version
        with:
          run-number: ${{ github.run_number }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          sccache: true
      - name: Build free-threaded wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist -i python3.14t
          sccache: true
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-windows-${{ matrix.platform.target }}
          path: dist
      - name: pytest
        # Skip pytest on x86 - cryptography (pulled in via the trustme dev
        # dependency) no longer ships 32-bit Windows wheels and fails to build
        # from source. The x64 job provides test coverage for Windows.
        if: ${{ matrix.platform.target == 'x64' }}
        shell: bash
        env:
          RUSTC_WRAPPER: ""
        run: |
          set -e
          uv sync --extra dev --find-links dist --reinstall
          uv run pytest

  macos:
    runs-on: ${{ matrix.platform.runner }}
    needs: [test, e2e]
    if: ${{ always() && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && (needs.test.result == 'success' || needs.test.result == 'skipped') && (needs.e2e.result == 'success' || needs.e2e.result == 'skipped') }}
    strategy:
      matrix:
        platform:
          - runner: macos-15
            target: x86_64
          - runner: macos-14
            target: aarch64
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Set version
        uses: ./.github/actions/set-version
        with:
          run-number: ${{ github.run_number }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          sccache: true
      - name: Build free-threaded wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist -i python3.14t
          sccache: true
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: dist
      - name: pytest
        env:
          RUSTC_WRAPPER: ""
        run: |
          set -e
          uv sync --extra dev --find-links dist --reinstall
          uv run pytest

  sdist:
    runs-on: ubuntu-latest
    needs: [test, e2e]
    if: ${{ always() && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && (needs.test.result == 'success' || needs.test.result == 'skipped') && (needs.e2e.result == 'success' || needs.e2e.result == 'skipped') }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Set version
        uses: ./.github/actions/set-version
        with:
          run-number: ${{ github.run_number }}
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v6
        with:
          name: wheels-sdist
          path: dist

  release:
    name: Release
    environment: pypi
    runs-on: ubuntu-latest
    # Release only on tag pushes or manual dispatch
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    needs: [linux, musllinux, windows, macos, sdist]
    permissions:
      # Use to sign the release artifacts
      id-token: write
      # Used to upload release artifacts
      contents: write
      # Used to generate artifact attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@v7
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: "wheels-*/*"
      - name: Publish to PyPI
        # Publish on tag pushes or manual dispatch
        if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
        uses: PyO3/maturin-action@v1
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        with:
          command: upload
          args: --non-interactive --skip-existing wheels-*/*
