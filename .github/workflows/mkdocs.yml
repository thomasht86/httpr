name: mkdocs
on:
  push:
    branches:
      - master
      - main
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: false
      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV
      - uses: actions/cache@v5
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-
      - run: uv sync --extra docs
      - name: Build docs
        run: uv run mkdocs build
      - name: Deploy to gh-pages (preserving benchmark data)
        run: |
          # Capture source commit BEFORE switching branches
          SOURCE_COMMIT=$(git rev-parse --short HEAD)

          # Save the built site before switching branches
          cp -r site /tmp/site-backup

          # Fetch gh-pages branch
          git fetch origin gh-pages:gh-pages || true

          # Save everything under dev/bench (httpr trend chart, client comparison)
          mkdir -p /tmp/bench-backup
          if git rev-parse --verify --quiet gh-pages:dev/bench > /dev/null; then
            git archive gh-pages dev/bench | tar -x -C /tmp/bench-backup
            echo "Preserving dev/bench from gh-pages"
          fi

          # Drop everything untracked before switching branches: the docs build
          # leaves the compiled extension, __pycache__, .venv and site/ in the
          # tree, and `git add -A` below would otherwise commit them to gh-pages
          # (site/ is already saved in /tmp/site-backup).
          git clean -fdxq

          # Switch to gh-pages branch
          git checkout gh-pages || git checkout --orphan gh-pages

          # Remove all tracked files
          git rm -rf . || true

          # Copy new docs from backup
          if [ ! -d "/tmp/site-backup" ] || [ -z "$(ls -A /tmp/site-backup 2>/dev/null)" ]; then
            echo "Error: site/ directory is empty or missing"
            exit 1
          fi
          cp -r /tmp/site-backup/* .

          # Restore dev/bench
          if [ -d /tmp/bench-backup/dev/bench ]; then
            mkdir -p dev
            cp -r /tmp/bench-backup/dev/bench dev/
            echo "Restored dev/bench"
          fi

          # Add all files and commit
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to deploy"
          else
            git commit -m "Deployed ${SOURCE_COMMIT} with MkDocs"
            git push origin gh-pages --force
          fi
