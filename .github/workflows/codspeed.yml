name: CodSpeed

on:
  push:
    branches:
      - main
  pull_request:
  # Lets CodSpeed trigger a backtest run to generate the initial baseline data.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OpenID Connect authentication with CodSpeed

jobs:
  benchmarks:
    name: Run benchmarks
    # The walltime instrument measures elapsed time, so it inherits the
    # machine's noise. CodSpeed recommends its bare-metal macro runners
    # (e.g. `codspeed-macro-x64-ryzen-9950x-ubuntu-24-04`), but those are only
    # available to repositories owned by a GitHub organization; until then the
    # suite runs on a shared GitHub-hosted runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Cache Rust build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # runner.arch keeps the cache valid if the job moves to a macro
          # runner with a different architecture.
          key: rust-codspeed-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            rust-codspeed-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: uv sync --extra dev

      # Benchmarks must run against an optimised build, otherwise they measure
      # debug assertions and unoptimised Rust rather than shipped code.
      - name: Build Rust extension (release mode)
        run: uv run maturin develop --release

      - name: Run benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          # httpr's benchmarks do real socket I/O against a local server.
          # Walltime counts that I/O; CPU simulation excludes syscalls.
          mode: walltime
          # --no-sync keeps uv from replacing the release build made above.
          run: uv run --no-sync pytest tests/benchmark/codspeed --codspeed
